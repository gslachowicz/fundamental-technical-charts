name: Update data

on:
  schedule:
    # Monday–Friday 22:20 UTC (after the US close, both in summer and winter time)
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
    inputs:
      fund_batch:
        description: "Fundamentals to refresh in this run (250 = daily rotation; 3000 = load everything now)"
        default: "250"
  push:
    branches: [main]
    paths: ["watchlist.txt", "site/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      INK_FUND_BATCH: ${{ inputs.fund_batch || '250' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps the last good data between runs, so a bad day at Yahoo never empties the site
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: ink-cache-${{ github.run_id }}
          restore-keys: ink-cache-

      - name: Build data from Yahoo Finance
        run: python scripts/build_data.py

      # macro calendar (BLS, BEA, Census, Fed) and the Fed rate odds from fed funds futures; a failure never blocks the deploy
      - name: Macro calendar and Fed odds
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/macro.py --out site/data/macro.json --cache cache

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: ink-cache-${{ github.run_id }}

      # screenshots of each tool for the rotating showcase on the welcome page (a failure never blocks the deploy)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Screenshots for the welcome page
        continue-on-error: true
        timeout-minutes: 12
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2 sharp@0.33.5
          npx playwright install --with-deps chromium
          (cd site && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          node scripts/showcase.mjs site http://127.0.0.1:8000

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
