name: Live prices

on:
  schedule:
    # every 15 minutes, Monday–Friday, 13:00–21:59 UTC (covers the US session in summer and winter time)
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch intraday prices
        run: python scripts/live_prices.py live.json

      # live.json goes to its own "live" branch (one commit, replaced every time), so the main
      # history stays clean and the site rebuild is not triggered
      - name: Publish to the live branch
        run: |
          mkdir pub && mv live.json pub/ && cd pub
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "Live prices"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
