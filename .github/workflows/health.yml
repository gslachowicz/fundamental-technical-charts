name: Health check

# Checks every 3 hours that the site, the data and the API respond, and that the nightly data is up to date.
# When a check fails the run fails, and GitHub emails the repository owner (Settings → Notifications → Actions).
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site, data and API
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request, urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          UA = {"User-Agent": "Ticker&Tape health check"}
          fails = []

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, b""
              except Exception as e:  # noqa: BLE001
                  return 0, str(e).encode()

          for url in ("https://tickerandtape.com/", "https://tickerandtape.com/chart/NVDA/", "https://tickerandtape.com/breadth/"):
              st, _ = get(url)
              print(url, st)
              if st != 200:
                  fails.append(f"{url} answered {st}")

          st, body = get("https://api.tickerandtape.com/")
          print("api", st)
          if st == 0 or st >= 500:
              fails.append(f"API answered {st}: {body[:200]!r}")

          st, body = get("https://tickerandtape.com/data/meta.json")
          if st != 200:
              fails.append(f"meta.json answered {st}")
          else:
              data_date = json.loads(body)["dataDate"]
              HOL = {"2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25","2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25",
                     "2027-01-01","2027-01-18","2027-02-15","2027-03-26","2027-05-31","2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24"}
              now = datetime.now(ZoneInfo("America/New_York"))
              d = now.date() if now.hour >= 21 else now.date() - timedelta(days=1)
              while d.weekday() >= 5 or d.isoformat() in HOL:
                  d -= timedelta(days=1)
              print("data date", data_date, "expected at least", d)
              if data_date < d.isoformat():
                  fails.append(f"Data is from {data_date}; the {d} session should already be in. Check the 'Update data' workflow.")

          if fails:
              print("\n".join("FAIL: " + f for f in fails))
              sys.exit(1)
          print("all good")
          PY
